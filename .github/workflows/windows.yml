name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: .\build.ps1
      - name: Smoke tests
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\smoke.ps1
      - name: Package
        run: .\scripts\package.ps1 -SkipBuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IslandMonitor-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version and build package
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match VERSION' }
          .\scripts\package.ps1
          powershell -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Smoke tests failed' }
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title "Island Monitor $env:RELEASE_TAG" --notes-file CHANGELOG.md dist/*.zip dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
