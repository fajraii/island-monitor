name: Bug report
description: Report a reproducible problem with Island Monitor.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: "Windows 11, 150% scaling, two monitors"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include relevant settings and what you clicked.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or errors
      description: Remove personal information before attaching files.
